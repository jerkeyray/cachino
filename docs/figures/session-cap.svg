<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc"><title id="title">Session limits pay off only when sessions outgrow the cache</title><desc id="desc">Per seed, wall clock with no limit, a two-session cap and a token budget. The cap removed eviction in every seed; the budget avoided waits but lost tokens from sessions it paused in seeds 4 and 5.</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;
--panel:#f3f2ee;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s1wash:#2a78d61f;--s2wash:#eb68341f;--on:#ffffff}
@media (prefers-color-scheme: dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;
--grid:#2c2c2a;--axis:#383835;--panel:#242422;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s1wash:#3987e526;
--s2wash:#d9592626;--on:#ffffff}}
.bg{fill:var(--surface)}.panel{fill:var(--panel)}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}.muted{fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--axis);stroke-width:1}
.box{fill:var(--surface);stroke:var(--axis);stroke-width:1}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}.fm{fill:var(--axis)}
.l1{stroke:var(--s1)}.l2{stroke:var(--s2)}.l3{stroke:var(--s3)}.lm{stroke:var(--muted)}
.w1{fill:var(--s1wash)}.w2{fill:var(--s2wash)}
.ring{stroke:var(--surface);stroke-width:2}.on{fill:var(--on)}
.arrow{stroke:var(--muted);stroke-width:1.5;fill:none}.head{fill:var(--muted)}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
.t{font-size:15px;font-weight:600}.st{font-size:12px}.lab{font-size:12px}.tick{font-size:11px}.small{font-size:10.5px}
.b{font-weight:600}
</style><rect class="bg" width="760" height="390" rx="0"/><text x="24" y="30" class="t ink">Session limits pay off only when sessions outgrow the cache</text><text x="24" y="49" class="st ink2">Four Qwen3-1.7B sessions through one proxy and one 438-block cache, five engine seeds.</text><line x1="110.0" y1="338.0" x2="546.0" y2="338.0" class="axis"/><line x1="110.0" y1="126.0" x2="110.0" y2="338.0" class="grid"/><line x1="193.8" y1="126.0" x2="193.8" y2="338.0" class="grid"/><line x1="277.7" y1="126.0" x2="277.7" y2="338.0" class="grid"/><line x1="361.5" y1="126.0" x2="361.5" y2="338.0" class="grid"/><line x1="445.4" y1="126.0" x2="445.4" y2="338.0" class="grid"/><line x1="529.2" y1="126.0" x2="529.2" y2="338.0" class="grid"/><text x="110.0" y="355.0" class="tick muted" text-anchor="middle">0 s</text><text x="193.8" y="355.0" class="tick muted" text-anchor="middle">250 s</text><text x="277.7" y="355.0" class="tick muted" text-anchor="middle">500 s</text><text x="361.5" y="355.0" class="tick muted" text-anchor="middle">750 s</text><text x="445.4" y="355.0" class="tick muted" text-anchor="middle">1000 s</text><text x="529.2" y="355.0" class="tick muted" text-anchor="middle">1250 s</text><text x="328.0" y="378.0" class="lab ink2" text-anchor="middle">Wall clock for all four sessions (Mac CPU)</text><text x="560.0" y="122.0" class="small ink2" text-anchor="start">Tokens lost to eviction</text><text x="560.0" y="136.0" class="small muted" text-anchor="start">off / cap / budget</text><text x="96.0" y="156.0" class="lab ink" text-anchor="end">Seed 1</text><line x1="173.5" y1="152.0" x2="177.7" y2="152.0" class="lm" stroke-width="2"/><circle cx="177.7" cy="152.0" r="5.0" class="f2 ring"/><circle cx="173.5" cy="152.0" r="5.0" class="f1 ring"/><path d="M176.3 146.5L181.8 152.0L176.3 157.5L170.8 152.0Z" class="f3 ring"/><text x="560.0" y="156.0" class="small ink2" text-anchor="start">0 / 0 / 0</text><text x="96.0" y="198.0" class="lab ink" text-anchor="end">Seed 2</text><line x