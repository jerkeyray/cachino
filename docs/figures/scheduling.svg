<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc"><title id="title">Scheduling sessions to avoid eviction</title><desc id="desc">Two sessions at a time or a greedy order removes eviction, cutting recomputation 16.5 percent, for a mean delay of about four to five positions.</desc><style>
svg{--surface:#ffffff;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;
--panel:#f3f2ee;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s1wash:#2a78d61f;--s2wash:#eb68341f;--on:#ffffff}
@media (prefers-color-scheme: dark){svg{--surface:#0d1117;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;
--grid:#21262d;--axis:#3d444d;--panel:#161b22;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s1wash:#3987e526;
--s2wash:#d9592626;--on:#ffffff}}
.bg{fill:var(--surface)}.panel{fill:var(--panel)}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}.muted{fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--axis);stroke-width:1}
.box{fill:var(--surface);stroke:var(--axis);stroke-width:1}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}.fm{fill:var(--axis)}
.l1{stroke:var(--s1)}.l2{stroke:var(--s2)}.l3{stroke:var(--s3)}.lm{stroke:var(--muted)}
.w1{fill:var(--s1wash)}.w2{fill:var(--s2wash)}
.ring{stroke:var(--surface);stroke-width:2}.on{fill:var(--on)}
.arrow{stroke:var(--muted);stroke-width:1.5;fill:none}.head{fill:var(--muted)}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
.t{font-size:15px;font-weight:600}.st{font-size:12px}.lab{font-size:12px}.tick{font-size:11px}.small{font-size:10.5px}
.b{font-weight:600}
</style><text x="24" y="30" class="t ink">Scheduling sessions to avoid eviction</text><text x="24" y="49" class="st ink2">One evicting four-session trace replayed on vLLM in five orders; each session keeps its own turn order.</text><line x1="78.0" y1="362.0" x2="724.0" y2="362.0" class="grid"/><line x1="78.0" y1="321.7" x2="724.0" y2="321.7" class="grid"/><line x1="78.0" y1="281.3" x2="724.0" y2="281.3" class="grid"/><line x1="78.0" y1="241.0" x2="724.0" y2="241.0" class="grid"/><line x1="78.0" y1="200.7" x2="724.0" y2="200.7" class="grid"/><line x1="78.0" y1="160.3" x2="724.0" y2="160.3" class="grid"/><line x1="78.0" y1="120.0" x2="724.0" y2="120.0" class="grid"/><text x="70.0" y="366.0" class="tick muted" text-anchor="end">21K</text><text x="70.0" y="325.7" class="tick muted" text-anchor="end">22K</text><text x="70.0" y="285.3" class="tick muted" text-anchor="end">23K</text><text x="70.0" y="245.0" class="tick muted" text-anchor="end">24K</text><text x="70.0" y="204.7" class="tick muted" text-anchor="end">25K</text><text x="70.0" y="164.3" class="tick muted" text-anchor="end">26K</text><text x="70.0" y="124.0" class="tick muted" text-anchor="end">27K</text><text x="78.0" y="106.0" class="lab ink2" text-anchor="start">Recomputed tokens</text><line x1="78.0" y1="362.0" x2="724.0" y2="362.0" class="axis"/><text x="107.4" y="379.0" class="tick muted" text-anchor="middle">0</text><text x="205.2" y="379.0" class="tick muted" text-anchor="middle">1</text><text x="303.1" y="379.0" class="tick muted" text-anchor="middle">2</text><text x="401.0" y="379.0" class="tick muted" text-anchor="middle">3</text><text x="498.9" y="379.0" class="tick muted" text-anchor="middle">4</text><text x="596.8" y="379.0" class="tick muted" text-anchor="middle">5</text><text x="694.6" y="379.0" class="tick muted" text-anchor="middle">6</text><text x="401.0" y="402.0" class="lab ink2" text-anchor="middle">Mean delay per request (positions later than recorded)</text><line x1="78.0" y1="321.2" x2="724.0" y2="321.2" class="lm"/><text x="724.0" y="337.2" class="small ink2" text-anchor="end">22,011: nothing evicted</text><circle cx="107.4" cy="145.7" r="5.0" class="f1 ring"/><text x="117.4" y="149.7" class="lab ink" text-anchor="start">Recorded interleaving</text><circle cx="662.3" cy="321.2" r="5.0" class="f1 ring"/><text x="662.3" y="309.2" class="lab ink" text-anchor="middle">One at a time</text><line x1="559.6" y1="314.2" x2="569.6" y2="285.2" class="lm"/><circle cx="559.6" cy="321.2" r="5.0" class="f1 ring"/><text x="569.6" y="281.2" class="lab ink" text-anchor="start">At most 2</text><circle cx="494.0" cy="153.4" r="5.0" class="f1 ring"/><text x="504.0" y="157.4" class="lab ink" text-anchor="start">At most 3 sessions</text><line x1="531.2" y1="314.2" x2="521.2" y2="285.2" class="lm"/><circle cx="531.2" cy="321.2" r="5.0" class="f1 ring"/><text x="521.2" y="281.2" class="lab ink" text-anchor="end">Greedy</text></svg>
