<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 384" role="img" aria-labelledby="title desc"><title id="title">Scheduling sessions to avoid eviction</title><desc id="desc">Two sessions at a time or a greedy order removes eviction, cutting recomputation 16.5 percent, for a mean delay of about four to five positions.</desc><style>
svg{--surface:#ffffff;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;
--panel:#f3f2ee;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s1wash:#2a78d61f;--s2wash:#eb68341f;--on:#ffffff}
@media (prefers-color-scheme: dark){svg{--surface:#0d1117;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;
--grid:#21262d;--axis:#3d444d;--panel:#161b22;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s1wash:#3987e526;
--s2wash:#d9592626;--on:#ffffff}}
.bg{fill:var(--surface)}.panel{fill:var(--panel)}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}.muted{fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--axis);stroke-width:1}
.box{fill:var(--surface);stroke:var(--axis);stroke-width:1}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}.fm{fill:var(--axis)}
.l1{stroke:var(--s1)}.l2{stroke:var(--s2)}.l3{stroke:var(--s3)}.lm{stroke:var(--muted)}
.w1{fill:var(--s1wash)}.w2{fill:var(--s2wash)}
.ring{stroke:var(--surface);stroke-width:2}.on{fill:var(--on)}
.arrow{stroke:var(--muted);stroke-width:1.5;fill:none}.head{fill:var(--muted)}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
.t{font-size:15px;font-weight:600}.st{font-size:12px}.lab{font-size:12px}.tick{font-size:11px}.small{font-size:10.5px}
.b{font-weight:600}
</style><text x="24.0" y="32.0" class="ink b" text-anchor="start" font-size="22">Scheduling sessions to avoid eviction</text><text x="24.0" y="58.0" class="ink2" text-anchor="start" font-size="15">One evicting trace, replayed on vLLM in five orders</text><text x="60.0" y="100.0" class="ink2" text-anchor="start" font-size="14">Recomputed tokens</text><line x1="60.0" y1="318.0" x2="536.0" y2="318.0" class="grid"/><line x1="60.0" y1="285.0" x2="536.0" y2="285.0" class="grid"/><line x1="60.0" y1="252.0" x2="536.0" y2="252.0" class="grid"/><line x1="60.0" y1="219.0" x2="536.0" y2="219.0" class="grid"/><line x1="60.0" y1="186.0" x2="536.0" y2="186.0" class="grid"/><line x1="60.0" y1="153.0" x2="536.0" y2="153.0" class="grid"/><line x1="60.0" y1="120.0" x2="536.0" y2="120.0" class="grid"/><text x="52.0" y="322.0" class="ink2" text-anchor="end" font-size="13">21K</text><text x="52.0" y="289.0" class="ink2" text-anchor="end" font-size="13">22K</text><text x="52.0" y="256.0" class="ink2" text-anchor="end" font-size="13">23K</text><text x="52.0" y="223.0" class="ink2" text-anchor="end" font-size="13">24K</text><text x="52.0" y="190.0" class="ink2" text-anchor="end" font-size="13">25K</text><text x="52.0" y="157.0" class="ink2" text-anchor="end" font-size="13">26K</text><text x="52.0" y="124.0" class="ink2" text-anchor="end" font-size="13">27K</text><line x1="60.0" y1="318.0" x2="536.0" y2="318.0" class="axis"/><text x="81.6" y="338.0" class="ink2" text-anchor="middle" font-size="13">0</text><text x="153.8" y="338.0" class="ink2" text-anchor="middle" font-size="13">1</text><text x="225.9" y="338.0" class="ink2" text-anchor="middle" font-size="13">2</text><text x="298.0" y="338.0" class="ink2" text-anchor="middle" font-size="13">3</text><text x="370.1" y="338.0" class="ink2" text-anchor="middle" font-size="13">4</text><text x="442.2" y="338.0" class="ink2" text-anchor="middle" font-size="13">5</text><text x="514.4" y="338.0" class="ink2" text-anchor="middle" font-size="13">6</text><text x="298.0" y="364.0" class="ink2" text-anchor="middle" font-size="14">Mean delay per request (positions later than recorded)</text><line x1="60.0" y1="284.6" x2="536.0" y2="284.6" class="lm" stroke-dasharray="4 4"/><text x="68.0" y="302.6" class="ink2" text-anchor="start" font-size="13">22,011 tokens: nothing evicted</text><circle cx="81.6" cy="141.0" r="6.0" class="f1 ring"/><text x="93.6" y="146.0" class="ink" text-anchor="start" font-size="14">Recorded order</text><circle cx="490.6" cy="284.6" r="6.0" class="f3 ring"/><text x="490.6" y="268.6" class="ink" text-anchor="middle" font-size="14">One at a time</text><line x1="414.8" y1="277.6" x2="404.8" y2="226.6" class="lm"/><circle cx="414.8" cy="284.6" r="6.0" class="f3 ring"/><text x="400.8" y="230.6" class="ink" text-anchor="end" font-size="14">At most 2 at once</text><circle cx="366.5" cy="147.4" r="6.0" class="f1 ring"/><text x="378.5" y="152.4" class="ink" text-anchor="start" font-size="14">At most 3 at once</text><line x1="393.9" y1="277.6" x2="383.9" y2="248.6" class="lm"/><circle cx="393.9" cy="284.6" r="6.0" class="f3 ring"/><text x="379.9" y="252.6" class="ink" text-anchor="end" font-size="14">Greedy</text></svg>
