<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 423" role="img" aria-labelledby="title desc"><title id="title">How Cachino measures prefix reuse</title><desc id="desc">The agent exchanges requests and responses with vLLM through Cachino. Cachino saves the bytes as a trace. Offline, it renders prompt token IDs, predicts cache hits, and attributes recomputation. An engine replay checks the token IDs and hit counts.</desc><style>
svg{--surface:#ffffff;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;
--panel:#f3f2ee;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s1wash:#2a78d61f;--s2wash:#eb68341f;--on:#ffffff}
@media (prefers-color-scheme: dark){svg{--surface:#0d1117;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;
--grid:#21262d;--axis:#3d444d;--panel:#161b22;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s1wash:#3987e526;
--s2wash:#d9592626;--on:#ffffff}}
.bg{fill:var(--surface)}.panel{fill:var(--panel)}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}.muted{fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--axis);stroke-width:1}
.box{fill:var(--surface);stroke:var(--axis);stroke-width:1}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}.fm{fill:var(--axis)}
.l1{stroke:var(--s1)}.l2{stroke:var(--s2)}.l3{stroke:var(--s3)}.lm{stroke:var(--muted)}
.w1{fill:var(--s1wash)}.w2{fill:var(--s2wash)}
.ring{stroke:var(--surface);stroke-width:2}.on{fill:var(--on)}
.arrow{stroke:var(--muted);stroke-width:1.5;fill:none}.head{fill:var(--muted)}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
.t{font-size:15px;font-weight:600}.st{font-size:12px}.lab{font-size:12px}.tick{font-size:11px}.small{font-size:10.5px}
.b{font-weight:600}
</style><text x="24.0" y="31.0" class="ink b" text-anchor="start" font-size="18">Live · record traffic</text><text x="104.0" y="75.0" class="ink b" text-anchor="middle" font-size="18">Coding agent</text><text x="280.0" y="75.0" class="ink b" text-anchor="middle" font-size="18">Cachino proxy</text><text x="456.0" y="75.0" class="ink b" text-anchor="middle" font-size="18">vLLM</text><path d="M164.0 65.0 L206.0 65.0" class="arrow"/><path d="M213.0 65.0L206.0 69.0L206.0 61.0Z" class="head"/><path d="M213.0 76.0 L171.0 76.0" class="arrow"/><path d="M164.0 76.0L171.0 72.0L171.0 80.0Z" class="head"/><path d="M347.0 65.0 L403.0 65.0" class="arrow"/><path d="M410.0 65.0L403.0 69.0L403.0 61.0Z" class="head"/><path d="M410.0 76.0 L354.0 76.0" class="arrow"/><path d="M347.0 76.0L354.0 72.0L354.0 80.0Z" class="head"/><text x="280.0" y="104.0" class="ink2" text-anchor="middle" font-size="15">Forwards request bodies unchanged</text><path d="M280.0 114.0 L280.0 128.0" class="arrow"/><path d="M280.0 135.0L276.0 128.0L284.0 128.0Z" class="head"/><rect x="99" y="135" width="362" height="38" rx="7" class="w1"/><text x="280.0" y="160.0" class="ink b" text-anchor="middle" font-size="18">Trace · request and response bytes</text><path d="M280.0 173.0 L280.0 190.0" class="arrow"/><path d="M280.0 197.0L276.0 190.0L284.0 190.0Z" class="head"/><line x1="24.0" y1="197.0" x2="260.0" y2="197.0" class="grid"/><line x1="300.0" y1="197.0" x2="536.0" y2="197.0" class="grid"/><text x="24.0" y="231.0" class="ink b" text-anchor="start" font-size="18">Offline · explain prefix reuse</text><line x1="39.0" y1="263.0" x2="39.0" y2="392.0" class="lm"/><circle cx="39" cy="263" r="14" class="panel"/><text x="39.0" y="268.0" class="ink2" text-anchor="middle" font-size="15">1</text><text x="66.0" y="269.0" class="ink b" text-anchor="start" font-size="18">Render</text><text x="162.0" y="268.0" class="ink2" text-anchor="start" font-size="15">Rebuild prompt token IDs from the capture</text><circle cx="39" cy="306" r="14" class="panel"/><text x="39.0" y="311.0" class="ink2" text-anchor="middle" font-size="15">2</text><text x="66.0" y="312.0" class="ink b" text-anchor="start" font-size="18">Predict</text><text x="162.0" y="311.0" class="ink2" text-anchor="start" font-size="15">Simulate the pinned vLLM cache</text><circle cx="39" cy="349" r="14" class="panel"/><text x="39.0" y="354.0" class="ink2" text-anchor="middle" font-size="15">3</text><text x="66.0" y="355.0" class="ink b" text-anchor="start" font-size="18">Attribute</text><text x="162.0" y="354.0" class="ink2" text-anchor="start" font-size="15">Explain which tokens had to be recomputed</text><circle cx="39" cy="392" r="14" class="panel"/><text x="39.0" y="397.0" class="ink2" text-anchor="middle" font-size="15">4</text><text x="66.0" y="398.0" class="ink b" text-anchor="start" font-size="18">Verify</text><text x="162.0" y="397.0" class="ink2" text-anchor="start" font-size="15">Replay against vLLM; compare IDs and hits</text></svg>
