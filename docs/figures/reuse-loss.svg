<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" role="img" aria-labelledby="title desc"><title id="title">What cuts prefix reuse?</title><desc id="desc">Three illustrative 12-block prompts. Eight blocks are reused when context is appended, five when earlier tokens change, and three when matching blocks are evicted. The remaining blocks are recomputed.</desc><style>
svg{--surface:#ffffff;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;
--panel:#f3f2ee;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s1wash:#2a78d61f;--s2wash:#eb68341f;--on:#ffffff}
@media (prefers-color-scheme: dark){svg{--surface:#0d1117;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;
--grid:#21262d;--axis:#3d444d;--panel:#161b22;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s1wash:#3987e526;
--s2wash:#d9592626;--on:#ffffff}}
.bg{fill:var(--surface)}.panel{fill:var(--panel)}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}.muted{fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--axis);stroke-width:1}
.box{fill:var(--surface);stroke:var(--axis);stroke-width:1}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}.fm{fill:var(--axis)}
.l1{stroke:var(--s1)}.l2{stroke:var(--s2)}.l3{stroke:var(--s3)}.lm{stroke:var(--muted)}
.w1{fill:var(--s1wash)}.w2{fill:var(--s2wash)}
.ring{stroke:var(--surface);stroke-width:2}.on{fill:var(--on)}
.arrow{stroke:var(--muted);stroke-width:1.5;fill:none}.head{fill:var(--muted)}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
.t{font-size:15px;font-weight:600}.st{font-size:12px}.lab{font-size:12px}.tick{font-size:11px}.small{font-size:10.5px}
.b{font-weight:600}
</style><text x="24.0" y="31.0" class="ink b" text-anchor="start" font-size="18">What cuts prefix reuse?</text><text x="24.0" y="54.0" class="ink2" text-anchor="start" font-size="15">Each cell represents one 32-token block of the next prompt.</text><text x="24.0" y="92.0" class="ink b" text-anchor="start" font-size="18">Context appended</text><text x="536.0" y="92.0" class="ink2" text-anchor="end" font-size="15">8 of 12 reused</text><rect x="24" y="104" width="39" height="22" rx="3" class="f1"/><rect x="67" y="104" width="39" height="22" rx="3" class="f1"/><rect x="110" y="104" width="39" height="22" rx="3" class="f1"/><rect x="153" y="104" width="39" height="22" rx="3" class="f1"/><rect x="196" y="104" width="39" height="22" rx="3" class="f1"/><rect x="239" y="104" width="39" height="22" rx="3" class="f1"/><rect x="282" y="104" width="39" height="22" rx="3" class="f1"/><rect x="325" y="104" width="39" height="22" rx="3" class="f1"/><rect x="368" y="104" width="39" height="22" rx="3" class="panel" stroke="var(--muted)"/><rect x="411" y="104" width="39" height="22" rx="3" class="fm"/><rect x="454" y="104" width="39" height="22" rx="3" class="fm"/><rect x="497" y="104" width="39" height="22" rx="3" class="fm"/><text x="24.0" y="166.0" class="ink b" text-anchor="start" font-size="18">Earlier tokens changed</text><text x="536.0" y="166.0" class="ink2" text-anchor="end" font-size="15">5 of 12 reused</text><rect x="24" y="178" width="39" height="22" rx="3" class="f1"/><rect x="67" y="178" width="39" height="22" rx="3" class="f1"/><rect x="110" y="178" width="39" height="22" rx="3" class="f1"/><rect x="153" y="178" width="39" height="22" rx="3" class="f1"/><rect x="196" y="178" width="39" height="22" rx="3" class="f1"/><rect x="239" y="178" width="39" height="22" rx="3" class="panel" stroke="var(--muted)"/><rect x="282" y="178" width="39" height="22" rx="3" class="f2"/><rect x="325" y="178" width="39" height="22" rx="3" class="f2"/><rect x="368" y="178" width="39" height="22" rx="3" class="f2"/><rect x="411" y="178" width="39" height="22" rx="3" class="fm"/><rect x="454" y="178" width="39" height="22" rx="3" class="fm"/><rect x="497" y="178" width="39" height="22" rx="3" class="fm"/><text x="24.0" y="240.0" class="ink b" text-anchor="start" font-size="18">Matching blocks were evicted</text><text x="536.0" y="240.0" class="ink2" text-anchor="end" font-size="15">3 of 12 reused</text><rect x="24" y="252" width="39" height="22" rx="3" class="f1"/><rect x="67" y="252" width="39" height="22" rx="3" class="f1"/><rect x="110" y="252" width="39" height="22" rx="3" class="f1"/><rect x="153" y="252" width="39" height="22" rx="3" class="f3"/><rect x="196" y="252" width="39" height="22" rx="3" class="f3"/><rect x="239" y="252" width="39" height="22" rx="3" class="f3"/><rect x="282" y="252" width="39" height="22" rx="3" class="f3"/><rect x="325" y="252" width="39" height="22" rx="3" class="f3"/><rect x="368" y="252" width="39" height="22" rx="3" class="panel" stroke="var(--muted)"/><rect x="411" y="252" width="39" height="22" rx="3" class="fm"/><rect x="454" y="252" width="39" height="22" rx="3" class="fm"/><rect x="497" y="252" width="39" height="22" rx="3" class="fm"/><line x1="24.0" y1="294.0" x2="536.0" y2="294.0" class="grid"/><rect x="24" y="308" width="14" height="14" rx="3" class="f1"/><text x="46.0" y="320.0" class="ink2" text-anchor="start" font-size="15">Reused</text><rect x="175" y="308" width="14" height="14" rx="3" class="f2"/><text x="197.0" y="320.0" class="ink2" text-anchor="start" font-size="15">After a change</text><rect x="356" y="308" width="14" height="14" rx="3" class="f3"/><text x="378.0" y="320.0" class="ink2" text-anchor="start" font-size="15">Evicted</text><rect x="24" y="337" width="14" height="14" rx="3" class="panel" stroke="var(--muted)"/><text x="46.0" y="349.0" class="ink2" text-anchor="start" font-size="15">Block rounding</text><rect x="175" y="337" width="14" height="14" rx="3" class="fm"/><text x="197.0" y="349.0" class="ink2" text-anchor="start" font-size="15">New context</text></svg>
