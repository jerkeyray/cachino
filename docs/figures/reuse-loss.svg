<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="title desc"><title id="title">Three ways an agent turn loses prefix reuse</title><desc id="desc">Three rows of blocks: append-only history reuses all shared blocks; a changed prompt recomputes everything after the first changed token; eviction recomputes blocks that matched but were no longer cached.</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;
--panel:#f3f2ee;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s1wash:#2a78d61f;--s2wash:#eb68341f;--on:#ffffff}
@media (prefers-color-scheme: dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;
--grid:#2c2c2a;--axis:#383835;--panel:#242422;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s1wash:#3987e526;
--s2wash:#d9592626;--on:#ffffff}}
.bg{fill:var(--surface)}.panel{fill:var(--panel)}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}.muted{fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--axis);stroke-width:1}
.box{fill:var(--surface);stroke:var(--axis);stroke-width:1}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}.fm{fill:var(--axis)}
.l1{stroke:var(--s1)}.l2{stroke:var(--s2)}.l3{stroke:var(--s3)}.lm{stroke:var(--muted)}
.w1{fill:var(--s1wash)}.w2{fill:var(--s2wash)}
.ring{stroke:var(--surface);stroke-width:2}.on{fill:var(--on)}
.arrow{stroke:var(--muted);stroke-width:1.5;fill:none}.head{fill:var(--muted)}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
.t{font-size:15px;font-weight:600}.st{font-size:12px}.lab{font-size:12px}.tick{font-size:11px}.small{font-size:10.5px}
.b{font-weight:600}
</style><rect class="bg" width="900" height="400" rx="0"/><text x="24" y="30" class="t ink">Three ways an agent turn loses prefix reuse</text><text x="24" y="49" class="st ink2">Each square is one 32-token KV block of the next prompt; vLLM reuses the longest run of cached full blocks from the start.</text><text x="24.0" y="111.0" class="lab ink b" text-anchor="start">Append-only history</text><text x="24.0" y="128.0" class="small ink2" text-anchor="start">the harness only appends</text><rect x="250.0" y="98.0" width="24" height="24" rx="4" class="f1"/><rect x="278.0" y="98.0" width="24" height="24" rx="4" class="f1"/><rect x="306.0" y="98.0" width="24" height="24" rx="4" class="f1"/><rect x="334.0" y="98.0" width="24" height="24" rx="4" class="f1"/><rect x="362.0" y="98.0" width="24" height="24" rx="4" class="f1"/><rect x="390.0" y="98.0" width="24" height="24" rx="4" class="f1"/><rect x="418.0" y="98.0" width="24" height="24" rx="4" class="f1"/><rect x="446.0" y="98.0" width="24" height="24" rx="4" class="f1"/><rect x="474.0" y="98.0" width="24" height="24" rx="4" class="f1"/><rect x="502.0" y="98.0" width="24" height="24" rx="4" class="f1"/><rect x="530.0" y="98.0" width="24" height="24" rx="4" class="f1"/><rect x="558.0" y="98.0" width="24" height="24" rx="4" class="f1"/><rect x="586.0" y="98.0" width="24" height="24" rx="4" class="f1"/><rect x="614.0" y="98.0" width="24" height="24" rx="4" class="panel" stroke="var(--muted)" stroke-width="1"/><rect x="642.0" y="98.0" width="24" height="24" rx="4" class="fm"/><rect x="670.0" y="98.0" width="24" height="24" rx="4" class="fm"/><rect x="698.0" y="98.0" width="24" height="24" rx="4" class="fm"/><rect x="726.0" y="98.0" width="24" height="24" rx="4" class="fm"/><text x="766.0" y="115.0" class="small ink2" text-anchor="start">13 of 18 reused</text><text x="24.0" y="191.0" class="lab ink b" text-anchor="start">Prompt changed</text><text x="24.0" y="208.0" class="small ink2" text-anchor="start">history re-rendered or edited</text><rect x="250.0" y="178.0" width="24" height="24" rx="4" class="f1"/><rect x="278.0" y="178.0" width="24" height="24" rx="4" class="f1"/><rect x="306.0" y="178.0" width="24" height="24" rx="4" class="f1"/><rect x="334.0" y="178.0" width="24" height="24" rx="4" class="f1"/><rect x="362.0" y="178.0" width="24" height="24" rx="4" class="f1"/><rect x="390.0" y="178.0" width="24" height="24" rx="4" class="f1"/><rect x="418.0" y="178.0" width="24" height="24" rx="4" class="f1"/><rect x="446.0" y="178.0" width="24" height="24" rx="4" class="f1"/><rect x="474.0" y="178.0" width="24" height="24" rx="4" class="f1"/><rect x="502.0" y="178.0" width="24" height="24" rx="4" class="panel" stroke="var(--muted)" stroke-width="1"/><rect x="530.0" y="178.0" width="24" height="24" rx="4" class="f2"/><rect x="558.0" y="178.0" width="24" height="24" rx="4" class="f2"/><rect x="586.0" y="178.0" width="24" height="24" rx="4" class="f2"/><rect x="614.0" y="178.0" width="24" height="24" rx="4" class="f2"/><rect x="642.0" y="178.0" width="24" height="24" rx="4" class="fm"/><rect x="670.0" y="178.0" width="24" height="24" rx="4" class="fm"/><rect x="698.0" y="178.0" width="24" height="24" rx="4" class="fm"/><rect x="726.0" y="178.0" width="24" height="24" rx="4" class="fm"/><line x1="514.0" y1="170.0" x2="514.0" y2="210.0" class="lm" stroke-width="1.5"/><text x="514.0" y="166.0" class="small ink2" text-anchor="middle">first changed token</text><text x="766.0" y="195.0" class="small ink2" text-anchor="start">9 of 18 reused</text><text x="24.0" y="271.0" class="lab ink b" text-anchor="start">Evicted</text><text x="24.0" y="288.0" class="small ink2" text-anchor="start">matched, but other requests took them</text><rect x="250.0" y="258.0" width="24" height="24" rx="4" class="f1"/><rect x="278.0" y="258.0" width="24" height="24" rx="4" class="f1"/><rect x="306.0" y="258.0" width="24" height="24" rx="4" class="f1"/><rect x="334.0" y="258.0" width="24" height="24" rx="4" class="f1"/><rect x="362.0" y="258.0" width="24" height="24" rx="4" class="f1"/><rect x="390.0" y="258.0" width="24" height="24" rx="4" class="f3"/><rect x="418.0" y="258.0" width="24" height="24" rx="4" class="f3"/><rect x="446.0" y="258.0" width="24" height="24" rx="4" class="f3"/><rect x="474.0" y="258.0" width="24" height="24" rx="4" class="f3"/><rect x="502.0" y="258.0" width="24" height="24" rx="4" class="f3"/><rect x="530.0" y="258.0" width="24" height="24" rx="4" class="f3"/><rect x="558.0" y="258.0" width="24" height="24" rx="4" class="f3"/><rect x="586.0" y="258.0" width="24" height="24" rx="4" class="f3"/><rect x="614.0" y="258.0" width="24" height="24" rx="4" class="panel" stroke="var(--muted)" stroke-width="1"/><rect x="642.0" y="258.0" width="24" height="24" rx="4" class="fm"/><rect x="670.0" y="258.0" width="24" height="24" rx="4" class="fm"/><rect x="698.0" y="258.0" width="24" height="24" rx="4" class="fm"/><rect x="726.0" y="258.0" width="24" height="24" rx="4" class="fm"/><text x="766.0" y="275.0" class="small ink2" text-anchor="start">5 of 18 reused</text><rect x="24.0" y="325.0" width="10" height="10" rx="2" class="f1"/><text x="40.0" y="334.0" class="lab ink2" text-anchor="start">Reused from cache</text><rect x="164.8" y="325.0" width="10" height="10" rx="2" class="f2"/><text x="180.8" y="334.0" class="lab ink2" text-anchor="start">Recomputed: prompt changed</text><rect x="363.2" y="325.0" width="10" height="10" rx="2" class="f3"/><text x="379.2" y="334.0" class="lab ink2" text-anchor="start">Recomputed: evicted</text><rect x="24" y="349" width="10" height="10" rx="2" class="panel" stroke="var(--muted)" stroke-width="1"/><text x="40.0" y="358.0" class="lab ink2" text-anchor="start">Recomputed: block rounding</text><rect x="250" y="349" width="10" height="10" rx="2" class="fm"/><text x="266.0" y="358.0" class="lab ink2" text-anchor="start">Recomputed: new content</text><text x="24.0" y="384.0" class="small ink2" text-anchor="start">Block rounding: the partly shared block, and the final prompt token, are never served from cache. Only new content is unavoidable.</text></svg>
