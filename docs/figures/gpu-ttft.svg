<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc"><title id="title">What eviction costs on a Tesla T4</title><desc id="desc">Columns: total time to first token falls from 43.9 s at 384 blocks to 23.6 s once nothing is evicted.</desc><style>
