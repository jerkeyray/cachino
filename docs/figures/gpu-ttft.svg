<svg xmlns="http://www.w3.org/2000/svg" width="504" height="353" viewBox="0 0 560 392" role="img" aria-labelledby="title desc"><title id="title">What eviction costs on a Tesla T4</title><desc id="desc">Columns: total time to first token falls from 43.9 s at 384 blocks to 23.6 s once nothing is evicted.</desc><style>
svg{--surface:#ffffff;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;
