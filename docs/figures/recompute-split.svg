<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">What a single session recomputes</title><desc id="desc">Three stacked bars: new content is 64 to 91 percent of recomputation, the re-prefilled reply and block rounding the rest.</desc><style>
svg{--surface:#ffffff;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;
--panel:#f3f2ee;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s1wash:#2a78d61f;--s2wash:#eb68341f;--on:#ffffff}
@media (prefers-color-scheme: dark){svg{--surface:#0d1117;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;
--grid:#21262d;--axis:#3d444d;--panel:#161b22;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s1wash:#3987e526;
--s2wash:#d9592626;--on:#ffffff}}
.bg{fill:var(--surface)}.panel{fill:var(--panel)}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}.muted{fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--axis);stroke-width:1}
.box{fill:var(--surface);stroke:var(--axis);stroke-width:1}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}.fm{fill:var(--axis)}
.l1{stroke:var(--s1)}.l2{stroke:var(--s2)}.l3{stroke:var(--s3)}.lm{stroke:var(--muted)}
.w1{fill:var(--s1wash)}.w2{fill:var(--s2wash)}
.ring{stroke:var(--surface);stroke-width:2}.on{fill:var(--on)}
.arrow{stroke:var(--muted);stroke-width:1.5;fill:none}.head{fill:var(--muted)}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
.t{font-size:15px;font-weight:600}.st{font-size:12px}.lab{font-size:12px}.tick{font-size:11px}.small{font-size:10.5px}
.b{font-weight:600}
</style><text x="24" y="30" class="t ink">What a single session recomputes</text><text x="24" y="49" class="st ink2">Recomputed tokens by cause from turn 1 on, mini-swe-agent on vLLM (Mac CPU); nothing was evicted.</text><line x1="232.0" y1="278.0" x2="610.0" y2="278.0" class="axis"/><line x1="232.0" y1="112.0" x2="232.0" y2="278.0" class="grid"/><line x1="326.5" y1="112.0" x2="326.5" y2="278.0" class="grid"/><line x1="421.0" y1="112.0" x2="421.0" y2="278.0" class="grid"/><line x1="515.5" y1="112.0" x2="515.5" y2="278.0" class="grid"/><line x1="610.0" y1="112.0" x2="610.0" y2="278.0" class="grid"/><text x="232.0" y="295.0" class="tick muted" text-anchor="middle">0%</text><text x="326.5" y="295.0" class="tick muted" text-anchor="middle">25%</text><text x="421.0" y="295.0" class="tick muted" text-anchor="middle">50%</text><text x="515.5" y="295.0" class="tick muted" text-anchor="middle">75%</text><text x="610.0" y="295.0" class="tick muted" text-anchor="middle">100%</text><text x="421.0" y="318.0" class="lab ink2" text-anchor="middle">Share of recomputed tokens</text><text x="220.0" y="140.0" class="lab ink" text-anchor="end">Qwen3-0.6B, 30 turns, greedy</text><rect x="232.0" y="124.0" width="254.0" height="24.0" class="f1"/><text x="240.0" y="140.5" class="small on b" text-anchor="start">68%</text><rect x="488.0" y="124.0" width="58.3" height="24.0" class="f2"/><text x="496.0" y="140.5" class="small on b" text-anchor="start">16%</text><path d="M548.3 124.0H606.0Q610.0 124.0 610.0 128.0V144.0Q610.0 148.0 606.0 148.0H548.3Z" class="f3"/><text x="556.3" y="140.5" class="small on b" text-anchor="start">16%</text><text x="622.0" y="135.0" class="small ink" text-anchor="start">95% of prompt</text><text x="622.0" y="149.0" class="small ink2" text-anchor="start">tokens reused</text><text x="220.0" y="192.0" class="lab ink" text-anchor="end">Qwen3-0.6B, 30 turns, sampled</text><rect x="232.0" y="176.0" width="241.8" height="24.0" class="f1"/><text x="240.0" y="192.5" class="small on b" text-anchor="start">64%</text><rect x="475.8" y="176.0" width="69.0" height="24.0" class="f2"/><text x="483.8" y="192.5" class="small on b" text-anchor="start">19%</text><path d="M546.8 176.0H606.0Q610.0 176.0 610.0 180.0V196.0Q610.0 200.0 606.0 200.0H546.8Z" class="f3"/><text x="554.8" y="192.5" class="small on b" text-anchor="start">17%</text><text x="622.0" y="187.0" class="small ink" text-anchor="start">95% of prompt</text><text x="622.0" y="201.0" class="small ink2" text-anchor="start">tokens reused</text><text x="220.0" y="244.0" class="lab ink" text-anchor="end">Qwen3-1.7B, 10 turns, varied</text><rect x="232.0" y="228.0" width="342.3" height="24.0" class="f1"/><text x="240.0" y="244.5" class="small on b" text-anchor="start">91%</text><rect x="576.3" y="228.0" width="23.9" height="24.0" class="f2"/><rect x="602.2" y="228.0" width="7.8" height="24.0" class="f3"/><text x="622.0" y="239.0" class="small ink" text-anchor="start">79% of prompt</text><text x="622.0" y="253.0" class="small ink2" text-anchor="start">tokens reused</text><rect x="24.0" y="71.0" width="10" height="10" rx="2" class="f1"/><text x="40.0" y="80.0" class="lab ink2" text-anchor="start">New content</text><rect x="126.4" y="71.0" width="10" height="10" rx="2" class="f2"/><text x="142.4" y="80.0" class="lab ink2" text-anchor="start">Previous reply, prefilled again</text><rect x="356.8" y="71.0" width="10" height="10" rx="2" class="f3"/><text x="372.8" y="80.0" class="lab ink2" text-anchor="start">Block rounding</text></svg>
