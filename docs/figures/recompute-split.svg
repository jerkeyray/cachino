<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="system-ui, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><title>Recomputed tokens by cause in single sessions</title><rect x="80" y="14" width="12" height="12" fill="#2f6fb5"/><text x="98" y="24" font-size="12" fill="#1f2328">New content</text><rect x="270" y="14" width="12" height="12" fill="#d9822b"/><text x="288" y="24" font-size="12" fill="#1f2328">Previous reply again</text><rect x="460" y="14" width="12" height="12" fill="#59636e"/><text x="478" y="24" font-size="12" fill="#1f2328">Block rounding</text><line x1="70" x2="660" y1="320.0" y2="320.0" stroke="#d0d7de"/><text x="64" y="324.0" font-size="11" fill="#59636e" text-anchor="end">0</text><line x1="70" x2="660" y1="264.0" y2="264.0" stroke="#d0d7de"/><text x="64" y="268.0" font-size="11" fill="#59636e" text-anchor="end">20</text><line x1="70" x2="660" y1="208.0" y2="208.0" stroke="#d0d7de"/><text x="64" y="212.0" font-size="11" fill="#59636e" text-anchor="end">40</text><line x1="70" x2="660" y1="152.0" y2="152.0" stroke="#d0d7de"/><text x="64" y="156.0" font-size="11" fill="#59636e" text-anchor="end">60</text><line x1="70" x2="660" y1="96.0" y2="96.0" stroke="#d0d7de"/><text x="64" y="100.0" font-size="11" fill="#59636e" text-anchor="end">80</text><line x1="70" x2="660" y1="40.0" y2="40.0" stroke="#d0d7de"/><text x="64" y="44.0" font-size="11" fill="#59636e" text-anchor="end">100</text><line x1="70" x2="660" y1="320" y2="320" stroke="#59636e"/><text x="365" y="362" font-size="12" fill="#1f2328" text-anchor="middle">Session</text><text x="16" y="180" font-size="12" fill="#1f2328" text-anchor="middle" transform="rotate(-90 16 180)">Share of recomputed tokens (%)</text><rect x="119.2" y="130.4" width="98.3" height="189.6" fill="#2f6fb5"/><rect x="119.2" y="85.7" width="98.3" height="44.7" fill="#d9822b"/><rect x="119.2" y="40.0" width="98.3" height="45.7" fill="#59636e"/><text x="168.3" y="336" font-size="11" fill="#59636