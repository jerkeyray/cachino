<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" role="img" aria-labelledby="title desc"><title id="title">What a single session recomputes</title><desc id="desc">Three stacked bars: new content is 64 to 91 percent of recomputation, the re-prefilled reply and block rounding the rest.</desc><style>
svg{--surface:#ffffff;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;
--panel:#f3f2ee;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s1wash:#2a78d61f;--s2wash:#eb68341f;--on:#ffffff}
@media (prefers-color-scheme: dark){svg{--surface:#0d1117;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;
--grid:#21262d;--axis:#3d444d;--panel:#161b22;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s1wash:#3987e526;
--s2wash:#d9592626;--on:#ffffff}}
.bg{fill:var(--surface)}.panel{fill:var(--panel)}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}.muted{fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--axis);stroke-width:1}
.box{fill:var(--surface);stroke:var(--axis);stroke-width:1}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}.fm{fill:var(--axis)}
.l1{stroke:var(--s1)}.l2{stroke:var(--s2)}.l3{stroke:var(--s3)}.lm{stroke:var(--muted)}
.w1{fill:var(--s1wash)}.w2{fill:var(--s2wash)}
.ring{stroke:var(--surface);stroke-width:2}.on{fill:var(--on)}
.arrow{stroke:var(--muted);stroke-width:1.5;fill:none}.head{fill:var(--muted)}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
.t{font-size:15px;font-weight:600}.st{font-size:12px}.lab{font-size:12px}.tick{font-size:11px}.small{font-size:10.5px}
.b{font-weight:600}
</style><text x="24.0" y="32.0" class="ink b" text-anchor="start" font-size="22">What a single session recomputes</text><text x="24.0" y="58.0" class="ink2" text-anchor="start" font-size="15">Recomputed tokens by cause, three sessions, no eviction</text><rect x="24.0" y="81.0" width="12" height="12" rx="2" class="f1"/><text x="44.0" y="92.0" class="ink2" text-anchor="start" font-size="14">New content</text><rect x="149.6" y="81.0" width="12" height="12" rx="2" class="f2"/><text x="169.6" y="92.0" class="ink2" text-anchor="start" font-size="14">Previous reply</text><rect x="298.0" y="81.0" width="12" height="12" rx="2" class="f3"/><text x="318.0" y="92.0" class="ink2" text-anchor="start" font-size="14">Block rounding</text><line x1="24.0" y1="110.0" x2="536.0" y2="110.0" class="grid"/><text x="24.0" y="142.0" class="ink" text-anchor="start" font-size="14">Qwen3-0.6B, 30 turns, greedy</text><text x="536.0" y="142.0" class="ink2" text-anchor="end" font-size="13">95% of prompt reused</text><rect x="24.0" y="152.0" width="344.7" height="26.0" class="f1"/><text x="33.0" y="170.0" class="on b" text-anchor="start" font-size="13">68%</text><rect x="370.7" y="152.0" width="79.7" height="26.0" class="f2"/><text x="379.7" y="170.0" class="on b" text-anchor="start" font-size="13">16%</text><path d="M452.4 152.0H532.0Q536.0 152.0 536.0 156.0V174.0Q536.0 178.0 532.0 178.0H452.4Z" class="f3"/><text x="461.4" y="170.0" class="on b" text-anchor="start" font-size="13">16%</text><text x="24.0" y="208.0" class="ink" text-anchor="start" font-size="14">Qwen3-0.6B, 30 turns, sampled</text><text x="536.0" y="208.0" class="ink2" text-anchor="end" font-size="13">95% of prompt reused</text><rect x="24.0" y="218.0" width="328.2" height="26.0" class="f1"/><text x="33.0" y="236.0" class="on b" text-anchor="start" font-size="13">64%</text><rect x="354.2" y="218.0" width="94.2" height="26.0" class="f2"/><text x="363.2" y="236.0" class="on b" text-anchor="start" font-size="13">19%</text><path d="M450.4 218.0H532.0Q536.0 218.0 536.0 222.0V240.0Q536.0 244.0 532.0 244.0H450.4Z" class="f3"/><text x="459.4" y="236.0" class="on b" text-anchor="start" font-size="13">17%</text><text x="24.0" y="274.0" class="ink" text-anchor="start" font-size="14">Qwen3-1.7B, 10 turns, varied</text><text x="536.0" y="274.0" class="ink2" text-anchor="end" font-size="13">79% of prompt reused</text><rect x="24.0" y="284.0" width="464.3" height="26.0" class="f1"/><text x="33.0" y="302.0" class="on b" text-anchor="start" font-size="13">91%</text><rect x="490.3" y="284.0" width="33.1" height="26.0" class="f2"/><path d="M525.4 284.0H532.0Q536.0 284.0 536.0 288.0V306.0Q536.0 310.0 532.0 310.0H525.4Z" class="f3"/><line x1="24.0" y1="320.0" x2="536.0" y2="320.0" class="axis"/><text x="24.0" y="340.0" class="ink2" text-anchor="start" font-size="13">0%</text><text x="152.0" y="340.0" class="ink2" text-anchor="middle" font-size="13">25%</text><text x="280.0" y="340.0" class="ink2" text-anchor="middle" font-size="13">50%</text><text x="408.0" y="340.0" class="ink2" text-anchor="middle" font-size="13">75%</text><text x="536.0" y="340.0" class="ink2" text-anchor="end" font-size="13">100%</text><text x="280.0" y="364.0" class="ink2" text-anchor="middle" font-size="14">Share of recomputed tokens</text></svg>
